<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | AccessGuard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"></head><body class="grid-bg min-h-screen bg-slate-950"><main class="mx-auto flex min-h-screen max-w-md items-center px-6"><form id="form" class="w-full rounded-lg border border-slate-700 bg-slate-900 p-8 text-white shadow-2xl"><a href="index.html" class="text-xl font-extrabold">Access<span class="text-blue-400">Guard</span></a><h1 class="mt-8 text-3xl font-extrabold">Create your account</h1><p id="error" class="mt-5 hidden rounded bg-rose-500/20 p-3 text-sm text-rose-200"></p><div class="mt-6 grid gap-4"><label class="text-sm font-bold">Full name<input name="fullName" required class="mt-2 w-full rounded border border-slate-600 bg-slate-800 px-3 py-3"></label><label class="text-sm font-bold">Username<input name="username" required pattern="[A-Za-z0-9_]{3,30}" class="mt-2 w-full rounded border border-slate-600 bg-slate-800 px-3 py-3"></label><label class="text-sm font-bold">Email<input name="email" type="email" required class="mt-2 w-full rounded border border-slate-600 bg-slate-800 px-3 py-3"></label><label class="text-sm font-bold">Password<input name="password" type="password" minlength="8" required class="mt-2 w-full rounded border border-slate-600 bg-slate-800 px-3 py-3"></label></div><button class="mt-7 w-full rounded bg-blue-600 py-3 font-bold">Create Account</button><p class="mt-5 text-center text-sm text-slate-400">Already registered? <a href="login.html" class="font-bold text-blue-400">Sign in</a></p></form></main><script src="js/api.js"></script><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{await API.request('/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});location.href='dashboard.html'}catch(x){const p=document.querySelector('#error');p.textContent=x.message;p.classList.remove('hidden')}}</script></body></html>
