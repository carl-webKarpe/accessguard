<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | AccessGuard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>protect('profile',()=>{layout('profile',`<p class="mono text-xs font-bold tracking-widest text-blue-600">ACCOUNT</p><h1 class="mt-2 text-3xl font-extrabold">My profile</h1><div class="mt-7 grid gap-6 lg:grid-cols-2"><section class="rounded-lg border bg-white p-6"><h2 class="font-extrabold">Profile information</h2><form id="profile" class="mt-5 grid gap-4"><label class="text-sm font-bold">Full name<input name="fullName" value="${currentUser.fullName}" class="mt-2 w-full rounded border p-3"></label><label class="text-sm font-bold">Email<input name="email" type="email" value="${currentUser.email}" class="mt-2 w-full rounded border p-3"></label><div class="grid grid-cols-2 gap-4 text-sm"><p><b>Username</b><span class="mt-1 block text-slate-500">${currentUser.username}</span></p><p><b>Role</b><span class="mt-1 block text-blue-600">${currentUser.role}</span></p><p><b>Status</b><span class="mt-1 block text-emerald-600">${currentUser.status}</span></p><p><b>Last login</b><span class="mt-1 block text-slate-500">${formatDate(currentUser.lastLogin)}</span></p></div><button class="rounded bg-blue-600 px-4 py-3 text-sm font-bold text-white">Save profile</button></form></section><section class="rounded-lg border bg-white p-6"><h2 class="font-extrabold">Change password</h2><form id="password" class="mt-5 grid gap-4"><input required name="currentPassword" type="password" placeholder="Current password" class="rounded border p-3"><input required minlength="8" name="newPassword" type="password" placeholder="New password" class="rounded border p-3"><button class="rounded border border-blue-600 px-4 py-3 text-sm font-bold text-blue-600">Update password</button></form></section></div>`);document.querySelector('#profile').onsubmit=submit('/auth/profile');document.querySelector('#password').onsubmit=submit('/auth/password')});function submit(url){return async e=>{e.preventDefault();try{await API.request(url,{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast(url.includes('password')?'Password changed.':'Profile saved.');e.target.reset()}catch(x){toast(x.message,'error')}}}</script></body></html>
