<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Records | AccessGuard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>protect('records',async()=>{if(currentUser.role==='USER'){layout('records','<h1 class="text-3xl font-extrabold">Available Records</h1><p class="mt-2 text-slate-500">Resources you are authorized to view.</p><div id="list" class="mt-8 grid gap-4 md:grid-cols-2"></div>');load();return}layout('records',`<div class="flex flex-wrap items-end justify-between gap-4"><div><p class="mono text-xs font-bold tracking-widest text-blue-600">RESOURCE MANAGEMENT</p><h1 class="mt-2 text-3xl font-extrabold">Records</h1></div><button id="new" class="rounded bg-blue-600 px-4 py-2 text-sm font-bold text-white">+ Add record</button></div><div id="formWrap" class="mt-6 hidden rounded-lg border bg-white p-6"><h2 id="formTitle" class="font-extrabold">New record</h2><form id="form" class="mt-4 grid gap-4"><input type="hidden" name="id"><input required name="title" maxlength="120" placeholder="Record title" class="rounded border px-3 py-3"><textarea required name="description" maxlength="2000" placeholder="Description" class="min-h-28 rounded border px-3 py-3"></textarea><div><button class="rounded bg-blue-600 px-4 py-2 text-sm font-bold text-white">Save record</button><button type="button" id="cancel" class="ml-2 px-4 py-2 text-sm font-bold">Cancel</button></div></form></div><div id="list" class="mt-7 grid gap-4 md:grid-cols-2"></div>`);document.querySelector('#new').onclick=()=>open();document.querySelector('#cancel').onclick=()=>document.querySelector('#formWrap').classList.add('hidden');document.querySelector('#form').onsubmit=save;load();});async function load(){try{const {records}=await API.request('/records');document.querySelector('#list').innerHTML=records.length?records.map(r=>`<article class="rounded-lg border bg-white p-5 shadow-sm"><h2 class="font-extrabold">${escapeHtml(r.title)}</h2><p class="mt-2 text-sm text-slate-500">${escapeHtml(r.description)}</p><p class="mt-4 text-xs text-slate-400">${r.creator} · ${formatDate(r.updated_at)}</p>${currentUser.role!=='USER'?`<div class="mt-4 flex gap-3 text-sm font-bold"><button onclick='edit(${JSON.stringify(r)})' class="text-blue-600">Edit</button>${currentUser.role==='ADMIN'?`<button onclick="removeRecord(${r.id})" class="text-rose-600">Delete</button>`:''}</div>`:''}</article>`).join(''):'<p class="text-slate-500">No records yet.</p>'}catch(e){if(e.status===403)deny();else toast(e.message,'error')}}function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}function open(r){const f=document.querySelector('#form');f.reset();if(r){f.id.value=r.id;f.title.value=r.title;f.description.value=r.description;document.querySelector('#formTitle').textContent='Edit record'}else document.querySelector('#formTitle').textContent='New record';document.querySelector('#formWrap').classList.remove('hidden')}function edit(r){open(r)}async function save(e){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));try{await API.request(v.id?`/records/${v.id}`:'/records',{method:v.id?'PUT':'POST',body:JSON.stringify(v)});toast('Record saved.');document.querySelector('#formWrap').classList.add('hidden');load()}catch(x){toast(x.message,'error')}}async function removeRecord(id){if(!confirm('Delete this record permanently?'))return;try{await API.request(`/records/${id}`,{method:'DELETE'});toast('Record deleted.');load()}catch(x){toast(x.message,'error')}}</script></body></html>
