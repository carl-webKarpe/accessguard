<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users | AccessGuard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>protect('users',async()=>{if(currentUser.role!=='ADMIN')return deny();const [u,r]=await Promise.all([API.request('/users'),API.request('/roles')]);layout('users',`<div class="flex justify-between"><div><p class="mono text-xs font-bold tracking-widest text-blue-600">ADMINISTRATION</p><h1 class="mt-2 text-3xl font-extrabold">User management</h1></div><button id="add" class="rounded bg-blue-600 px-4 py-2 text-sm font-bold text-white">+ Add user</button></div><div id="formWrap" class="mt-6 hidden rounded-lg border bg-white p-6"><form id="form" class="grid gap-3 md:grid-cols-2"><input required name="fullName" placeholder="Full name" class="rounded border p-3"><input required name="username" placeholder="Username" class="rounded border p-3"><input required name="email" type="email" placeholder="Email" class="rounded border p-3"><input required name="password" type="password" minlength="8" placeholder="Temporary password" class="rounded border p-3"><select name="roleId" class="rounded border p-3">${r.roles.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><button class="rounded bg-blue-600 p-3 font-bold text-white">Create user</button></form></div><div class="mt-7 overflow-x-auto rounded-lg border bg-white"><table class="w-full text-left text-sm"><thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="p-4">NAME</th><th class="p-4">EMAIL</th><th class="p-4">ROLE</th><th class="p-4">STATUS</th><th class="p-4">LAST LOGIN</th><th class="p-4">ACTIONS</th></tr></thead><tbody>${u.users.map(x=>`<tr class="border-t"><td class="p-4 font-bold">${x.full_name}<span class="block text-xs font-normal text-slate-400">${x.username}</span></td><td class="p-4">${x.email}</td><td class="p-4"><select onchange="changeRole(${x.id},this.value)" class="rounded border p-1 text-xs">${r.roles.map(z=>`<option value="${z.id}" ${z.name===x.role?'selected':''}>${z.name}</option>`).join('')}</select></td><td class="p-4"><button onclick="toggle(${x.id},'${x.full_name}','${x.email}','${x.status}')" class="rounded px-2 py-1 text-xs font-bold ${x.status==='ACTIVE'?'bg-emerald-100 text-emerald-700':'bg-slate-200'}">${x.status}</button></td><td class="p-4 text-xs">${formatDate(x.last_login)}</td><td class="p-4"><button onclick="del(${x.id})" class="font-bold text-rose-600">Delete</button></td></tr>`).join('')}</tbody></table></div>`);document.querySelector('#add').onclick=()=>document.querySelector('#formWrap').classList.toggle('hidden');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{await API.request('/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});location.reload()}catch(x){toast(x.message,'error')}}});async function changeRole(id,roleId){try{await API.request(`/users/${id}/role`,{method:'PUT',body:JSON.stringify({roleId})});toast('Role updated.')}catch(e){toast(e.message,'error')}}async function toggle(id,fullName,email,status){try{await API.request(`/users/${id}`,{method:'PUT',body:JSON.stringify({fullName,email,status:status==='ACTIVE'?'INACTIVE':'ACTIVE'})});location.reload()}catch(e){toast(e.message,'error')}}async function del(id){if(confirm('Delete user?'))try{await API.request(`/users/${id}`,{method:'DELETE'});location.reload()}catch(e){toast(e.message,'error')}}</script></body></html>
