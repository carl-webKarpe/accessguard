<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | AccessGuard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>protect('dashboard',async()=>{const d=await API.request('/dashboard');const card=(label,value,color)=>`<div class="rounded-lg border bg-white p-5 shadow-sm"><p class="mono text-xs font-bold tracking-widest text-slate-400">${label}</p><b class="mt-2 block text-3xl ${color}">${value}</b></div>`;const stats=currentUser.role==='USER'?[card('AVAILABLE RECORDS',d.stats.records,'text-blue-600'),card('ACCOUNT STATUS',currentUser.status,'text-emerald-600')]:[card('TOTAL USERS',d.stats.users,'text-blue-600'),card('ACTIVE USERS',d.stats.activeUsers,'text-emerald-600'),card('TOTAL RECORDS',d.stats.records,'text-indigo-600'),card('SECURITY EVENTS',d.stats.events,'text-amber-600')];layout('dashboard',`<div class="reveal"><p class="mono text-xs font-bold tracking-widest text-blue-600">${currentUser.role} WORKSPACE</p><h1 class="mt-2 text-3xl font-extrabold">Welcome, ${currentUser.fullName.split(' ')[0]}.</h1><p class="mt-2 text-slate-500">Your access is governed by the principle of least privilege.</p><div class="mt-8 grid gap-4 sm:grid-cols-2 ${currentUser.role==='USER'?'lg:grid-cols-2':'lg:grid-cols-4'}">${stats.join('')}</div><div class="mt-8 grid gap-6 lg:grid-cols-5"><section class="rounded-lg border bg-white p-6 lg:col-span-3"><div class="flex justify-between"><h2 class="font-extrabold">Recent Activity</h2>${currentUser.role==='ADMIN'?'<a href="logs.html" class="text-sm font-bold text-blue-600">View all</a>':''}</div><div class="mt-5 space-y-4">${d.activity.length?d.activity.map(a=>`<div class="flex gap-3 border-b pb-3 last:border-0"><span class="mt-1 h-2 w-2 shrink-0 rounded-full bg-blue-500"></span><div><b class="text-sm">${a.action.replaceAll('_',' ')}</b><p class="text-xs text-slate-500">${a.full_name||'System'} · ${formatDate(a.created_at)}</p></div></div>`).join(''):'<p class="text-sm text-slate-500">No activity recorded yet.</p>'}</div></section><section class="rounded-lg bg-slate-950 p-6 text-white lg:col-span-2"><p class="mono text-xs tracking-widest text-blue-300">SYSTEM STATUS</p><b class="mt-4 block text-xl">All controls operational</b><p class="mt-2 text-sm text-slate-400">Sessions, authorization checks, and audit logging are active.</p><a href="records.html" class="mt-6 inline-block rounded bg-blue-600 px-4 py-2 text-sm font-bold">Open records</a></section></div></div>`)});</script></body></html>
