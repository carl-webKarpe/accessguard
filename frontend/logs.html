<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity Logs | AccessGuard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>protect('logs',async()=>{if(currentUser.role!=='ADMIN')return deny();const {logs}=await API.request('/audit-logs');layout('logs',`<p class="mono text-xs font-bold tracking-widest text-blue-600">SECURITY MONITORING</p><h1 class="mt-2 text-3xl font-extrabold">Activity logs</h1><div class="mt-7 overflow-x-auto rounded-lg border bg-white"><table class="w-full text-left text-sm"><thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="p-4">USER</th><th class="p-4">ACTION</th><th class="p-4">ROLE</th><th class="p-4">STATUS</th><th class="p-4">DATE / TIME</th></tr></thead><tbody>${logs.map(x=>`<tr class="border-t"><td class="p-4 font-bold">${x.full_name||'System'}</td><td class="p-4">${x.action.replaceAll('_',' ')}</td><td class="p-4">${x.role||'—'}</td><td class="p-4"><span class="rounded bg-emerald-100 px-2 py-1 text-xs font-bold text-emerald-700">SUCCESS</span></td><td class="p-4 text-xs">${formatDate(x.created_at)}</td></tr>`).join('')}</tbody></table></div>`)});</script></body></html>
