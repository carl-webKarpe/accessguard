<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roles | AccessGuard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>protect('roles',async()=>{if(currentUser.role!=='ADMIN')return deny();const roles=(await API.request('/roles')).roles;const details=await Promise.all(roles.map(async r=>[r,await API.request(`/roles/${r.id}/permissions`)]));layout('roles',`<p class="mono text-xs font-bold tracking-widest text-blue-600">ADMINISTRATION</p><h1 class="mt-2 text-3xl font-extrabold">Roles & permissions</h1><div class="mt-7 grid gap-4 lg:grid-cols-3">${details.map(([r,p])=>`<section class="rounded-lg border bg-white p-6"><p class="mono text-xs text-blue-600">${r.name}</p><h2 class="mt-2 font-extrabold">${r.description}</h2><div class="mt-5 space-y-2 text-sm">${p.permissions.map(x=>`<p class="text-emerald-700">✓ ${x.description}</p>`).join('')}</div></section>`).join('')}</div><section class="mt-8 overflow-x-auto rounded-lg border bg-white"><table class="w-full text-left text-sm"><thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="p-4">FEATURE</th><th class="p-4">ADMIN</th><th class="p-4">STAFF</th><th class="p-4">USER</th></tr></thead><tbody>${['Dashboard','View Records','Create Records','Update Records','Delete Records','Manage Users','Manage Roles','Audit Logs','Settings'].map((x,i)=>`<tr class="border-t"><td class="p-4 font-bold">${x}</td><td class="p-4 text-emerald-600">✓</td><td class="p-4">${i<4?'✓':'—'}</td><td class="p-4">${i<2?'✓':'—'}</td></tr>`).join('')}</tbody></table></section>`)});</script></body></html>
